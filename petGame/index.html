<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity Web Player | MindU Pet</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000; /* Black background for side letterboxing */
      }

      #unity-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #unity-canvas {
        display: block;
        background: #231F20;
        height: 100%; /* Always fill the full height */
        width: auto; /* Width adjusts to maintain aspect ratio */
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>
    </div>
    
    <script src="Build/petGame.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      
      // Fit canvas to full height with side letterbox
      function fitCanvas() {
        const windowHeight = window.innerHeight;
        const gameAspect = 1080 / 1920; // Width / Height = 0.5625
        
        // Always use full height, calculate width based on aspect ratio
        canvas.style.height = windowHeight + 'px';
        canvas.style.width = (windowHeight * gameAspect) + 'px';
      }

      // Initial fit
      fitCanvas();

      // Refit on window resize or orientation change
      window.addEventListener('resize', fitCanvas);
      window.addEventListener('orientationchange', () => {
        setTimeout(fitCanvas, 100);
      });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/petGame.data.gz",
        frameworkUrl: "Build/petGame.framework.js.gz",
        codeUrl: "Build/petGame.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "MindU Pet",
        productVersion: "1.0",
        matchWebGLToCanvasSize: true,
        devicePixelRatio: window.devicePixelRatio || 1,
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        console.log("✅ Unity game loaded");
        fitCanvas(); // Ensure proper size after loading
      }).catch((message) => {
        console.error("❌ Unity load error:", message);
        alert("Failed to load game: " + message);
      });
    </script>
  </body>
</html>
